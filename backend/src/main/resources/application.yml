spring:
  application:
    name: thinkbuild-accounts
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thinkbuild_accounts}
    username: ${DB_USERNAME:thinkbuild}
    password: ${DB_PASSWORD:ThinkBuild@2024}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:VGhpbmtCdWlsZEFjY291bnRzU2VjcmV0S2V5Rm9ySlNPTldlYlRva2VuMjAyNA==}
    refresh-secret: ${JWT_REFRESH_SECRET:VGhpbmtCdWlsZEFjY291bnRzUmVmcmVzaFNlY3JldEtleUZvckpTT05XZWJUb2tlbjIwMjQ=}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  security:
    max-failed-attempts: 5
    lock-duration-minutes: 5

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
